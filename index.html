<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XUGUO ｜ Jerry - 极客标签导航与管理站</title>
  <!-- 引入 Tailwind CSS 确保极佳的现代 UI 体验 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Alpine.js 提供响应式交互 -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white" x-data="bookmarkApp()">

  <!-- 顶栏导航 -->
  <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-600 text-white font-black px-3 py-1.5 rounded-lg text-sm tracking-wider shadow-lg shadow-blue-500/20">
          XUGUO ｜ Jerry
        </div>
        <span class="text-slate-400 text-sm hidden sm:inline">| 极客标签导航与智能管理站</span>
      </div>
      <div class="flex items-center space-x-4">
        <button @click="openAdminModal = true" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg border border-slate-700 transition flex items-center space-x-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          <span>后台管理</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主体内容 -->
  <main class="max-w-6xl mx-auto px-6 py-10 flex-grow w-full">
    
    <!-- 搜索与分类过滤栏 -->
    <div class="mb-10 flex flex-col md:flex-row gap-4 items-center justify-between">
      <div class="relative w-full md:w-96">
        <input type="text" x-model="searchKeyword" placeholder="搜索网址、标题或标签..." class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-3 pl-11 text-sm focus:outline-none focus:border-blue-500 text-slate-200 placeholder-slate-500 shadow-inner">
        <svg class="w-5 h-5 text-slate-500 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>
      <!-- 分类标签按钮 -->
      <div class="flex flex-wrap gap-2 w-full md:w-auto">
        <button @click="currentCategory = 'all'" :class="currentCategory === 'all' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'" class="px-4 py-2 rounded-xl text-xs font-medium transition">全部</button>
        <template x-for="cat in categories" :key="cat">
          <button @click="currentCategory = cat" :class="currentCategory === cat ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'" class="px-4 py-2 rounded-xl text-xs font-medium transition" x-text="cat"></button>
        </template>
      </div>
    </div>

    <!-- 标签卡片网格 -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      <template x-for="item in filteredBookmarks" :key="item.url">
        <a :href="item.url" target="_blank" class="group bg-slate-800/50 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 p-5 rounded-2xl transition duration-200 flex flex-col justify-between shadow-lg relative overflow-hidden">
          <div class="absolute top-0 right-0 w-24 h-24 bg-blue-500/5 rounded-full blur-2xl group-hover:bg-blue-500/15 transition"></div>
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs px-2.5 py-1 rounded-md bg-slate-700/60 text-blue-400 font-mono" x-text="item.category"></span>
              <svg class="w-4 h-4 text-slate-500 group-hover:text-blue-400 transition transform group-hover:translate-x-0.5 group-hover:-translate-y-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
            </div>
            <h3 class="font-semibold text-slate-200 group-hover:text-blue-400 transition text-base mb-1" x-text="item.title"></h3>
            <p class="text-xs text-slate-400 line-clamp-1 font-mono" x-text="item.url"></p>
          </div>
        </a>
      </template>
    </div>

    <!-- 空状态提示 -->
    <div x-show="filteredBookmarks.length === 0" class="text-center py-20 text-slate-500">
      没有找到匹配的标签网址
    </div>
  </main>

  <!-- 后台管理 Modal (输入 PAT 解密与增删改查) -->
  <div x-show="openAdminModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4" style="display: none;">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      
      <!-- 模态框头部 -->
      <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-950">
        <h3 class="font-bold text-slate-200 flex items-center space-x-2">
          <span>🛠️ 标签站点管理后台</span>
        </h3>
        <button @click="openAdminModal = false" class="text-slate-400 hover:text-white">&times;</button>
      </div>

      <!-- 模态框主体 -->
      <div class="p-6 overflow-y-auto space-y-6 flex-grow">
        
        <!-- 第一步：PAT 认证 -->
        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
          <label class="block text-xs font-semibold text-slate-400 mb-2">GitHub Personal Access Token (PAT) 验证</label>
          <div class="flex gap-2">
            <input type="password" x-model="githubToken" placeholder="输入具备 repo 权限的 GitHub Token..." class="flex-grow bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
            <button @click="verifyToken()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-xs font-medium transition">验证并解锁</button>
          </div>
          <p class="text-[11px] text-slate-500 mt-1.5">Token 仅临时保存在当前会话内存中，关闭网页即自动销毁，安全不落盘。</p>
        </div>

        <!-- 第二步：解锁后的管理面板 -->
        <div x-show="isAuthorized" class="space-y-6">
          <div class="border-t border-slate-800 pt-4">
            <h4 class="text-sm font-semibold text-slate-300 mb-3">➕ 添加新标签网址</h4>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3">
              <input type="text" x-model="newBookmark.title" placeholder="网站标题" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200">
              <input type="text" x-model="newBookmark.url" placeholder="网址 (https://...)" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200">
              <input type="text" x-model="newBookmark.category" placeholder="分类名称" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200">
            </div>
            <button @click="addBookmark()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-xs font-medium transition">确认添加</button>
          </div>

          <div class="border-t border-slate-800 pt-4">
            <h4 class="text-sm font-semibold text-slate-300 mb-3">📋 现有标签列表与删除</h4>
            <div class="space-y-2 max-h-48 overflow-y-auto pr-2">
              <template x-for="(item, index) in bookmarks" :key="item.url">
                <div class="flex items-center justify-between bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-xs">
                  <div>
                    <span class="font-medium text-slate-200" x-text="item.title"></span>
                    <span class="text-slate-500 ml-2 font-mono text-[11px]" x-text="item.url"></span>
                  </div>
                  <button @click="removeBookmark(index)" class="text-rose-400 hover:text-rose-300 px-2 py-1 bg-rose-950/40 rounded border border-rose-900/50">删除</button>
                </div>
              </template>
            </div>
          </div>
        </div>

      </div>

      <!-- 模态框底部同步按钮 -->
      <div class="px-6 py-4 border-t border-slate-800 bg-slate-950 flex items-center justify-between">
        <span class="text-xs text-slate-400" x-text="syncStatus"></span>
        <button x-show="isAuthorized" @click="syncToGitHub()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl text-xs font-bold transition shadow-lg shadow-blue-600/20">同步并发布到 GitHub 仓库</button>
      </div>

    </div>
  </div>

  <!-- 页脚 -->
  <footer class="border-t border-slate-800/60 py-6 text-center text-xs text-slate-500">
    <p>&copy; 2026 XUGUO ｜ Jerry. All Rights Reserved. Powered by GitHub Pages & API.</p>
  </footer>

  <script>
    function bookmarkApp() {
      return {
        searchKeyword: '',
        currentCategory: 'all',
        openAdminModal: false,
        githubToken: '',
        isAuthorized: false,
        syncStatus: '',
        
        // 初始标签数据（后续会从 data.json 或同步中加载）
        bookmarks: [

        ],

        newBookmark: { title: '', url: '', category: '' },

        get categories() {
          return [...new Set(this.bookmarks.map(i => i.category))];
        },

        get filteredBookmarks() {
          return this.bookmarks.filter(item => {
            let matchCat = this.currentCategory === 'all' || item.category === this.currentCategory;
            let matchKw = item.title.toLowerCase().includes(this.searchKeyword.toLowerCase()) || 
                          item.url.toLowerCase().includes(this.searchKeyword.toLowerCase()) ||
                          item.category.toLowerCase().includes(this.searchKeyword.toLowerCase());
            return matchCat && matchKw;
          });
        },

        async init() {
          // 尝试自动加载同目录下的 data.json
          try {
            let res = await fetch('./data.json?t=' + Date.now());
            if (res.ok) {
              let data = await res.json();
              if (Array.isArray(data)) this.bookmarks = data;
            }
          } catch(e) {
            console.log('使用默认本地初始数据');
          }
        },

        async verifyToken() {
          if (!this.githubToken) {
            alert('请先输入 GitHub PAT');
            return;
          }
          this.syncStatus = '正在验证 Token...';
          try {
            let res = await fetch('https://api.github.com/user', {
              headers: { 'Authorization': `Bearer ${this.githubToken}` }
            });
            if (res.ok) {
              this.isAuthorized = true;
              this.syncStatus = '验证成功！已解锁后台管理。';
            } else {
              alert('Token 验证失败，请检查权限或有效性。');
              this.syncStatus = '验证失败';
            }
          } catch(e) {
            alert('网络异常');
            this.syncStatus = '';
          }
        },

        addBookmark() {
          if (!this.newBookmark.title || !this.newBookmark.url || !this.newBookmark.category) {
            alert('请完整填写标题、网址与分类');
            return;
          }
          this.bookmarks.push({ ...this.newBookmark });
          this.newBookmark = { title: '', url: '', category: '' };
        },

        removeBookmark(index) {
          this.bookmarks.splice(index, 1);
        },

        async syncToGitHub() {
          if (!this.isAuthorized) return;
          this.syncStatus = '正在同步数据到 GitHub 仓库...';

          // 配置你的 GitHub 用户名与仓库名
          // 配置你的 GitHub 用户名与仓库名
          const owner = '234146326';
          const repo = '234146326.github.io'; // <--- 修改后
          const path = 'data.json';

          try {
            // 1. 获取当前文件的 SHA（GitHub API 更新文件必须提供对应文件的 SHA）
            let getFileRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
              headers: { 'Authorization': `Bearer ${this.githubToken}` }
            });
            
            let fileSha = '';
            if (getFileRes.ok) {
              let fileData = await getFileRes.json();
              fileSha = fileData.sha;
            }

            // 2. 提交更新到 GitHub
            let contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(this.bookmarks, null, 2))));
            let putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
              method: 'PUT',
              headers: {
                'Authorization': `Bearer ${this.githubToken}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                message: 'chore: update bookmarks data via web admin',
                content: contentEncoded,
                sha: fileSha || undefined
              })
            });

            if (putRes.ok) {
              this.syncStatus = '同步成功！GitHub Pages 正在自动重新部署，约 1 分钟后生效。';
              setTimeout(() => { this.openAdminModal = false; }, 3000);
            } else {
              let err = await putRes.json();
              alert('同步失败: ' + (err.message || '未知错误'));
              this.syncStatus = '同步失败';
            }
          } catch(e) {
            alert('网络异常：' + e.message);
            this.syncStatus = '';
          }
        }
      }
    }
  </script>
</body>
</html>
